[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blog-image"
version = "0.1.0"
description = "Generate article cover images in several aspect ratios from a short YAML file."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "F-Overseas Solutions" }]
keywords = ["blog", "cover-image", "og-image", "social-card", "pillow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=10.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.17"]

[project.urls]
Homepage = "https://github.com/foverseas/blog-image"
Repository = "https://github.com/foverseas/blog-image"
Issues = "https://github.com/foverseas/blog-image/issues"
Discord = "https://discord.gg/FS2xqJ4QT6"

[project.scripts]
blog-image = "blog_image.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blog_image"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# The ambiguous characters are deliberate: French typography sets a
# non-breaking space before `?`, and `1600×900` is a size users type.
ignore = ["RUF001"]
